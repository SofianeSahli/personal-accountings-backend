services:
  personal-accounting-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: personal-accounting-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      - mysql
    networks:
      - personal-accounting-backend-network
      - redis-network

  nginx:
    image: nginx:alpine
    container_name: personal-accounting-backend-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - personal-accounting-backend
    networks:
      - personal-accounting-backend-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expenses_db
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - personal-accounting-backend-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - personal-accounting-backend-network

volumes:
  vendor_data:
  mysql_data:

networks:
  personal-accounting-backend-network:
    driver: bridge
  redis-network:
    external : true 
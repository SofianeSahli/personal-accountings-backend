services:
  personal-accounting-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: personal-accounting-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - personal-accounting-backend-network

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_FORWARD_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - personal-accounting-backend
    networks:
      - personal-accounting-backend-network

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    command:
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    configs:
      - source: mysql-test-database
        target: /docker-entrypoint-initdb.d/01-test-database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - personal-accounting-backend-network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    restart: unless-stopped
    labels:
      scope: local-only
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${PMA_FORWARD_PORT:-8080}:80"
    networks:
      - personal-accounting-backend-network

configs:
  mysql-test-database:
    content: |
      CREATE DATABASE IF NOT EXISTS `${DB_TEST_DATABASE:?DB_TEST_DATABASE is required}` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
      SET @test_database_pattern = REPLACE(REPLACE('${DB_TEST_DATABASE}', '_', '\\_'), '%', '\\%');
      SET @grant_test_database = CONCAT('GRANT ALL PRIVILEGES ON `', @test_database_pattern, '`.* TO ''${DB_USERNAME}''@''%''');
      PREPARE grant_test_database FROM @grant_test_database;
      EXECUTE grant_test_database;
      DEALLOCATE PREPARE grant_test_database;

volumes:
  vendor_data:
  mysql_data:

networks:
  personal-accounting-backend-network:
    driver: bridge
